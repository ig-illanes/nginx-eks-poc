apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edx-poc-ing
  namespace: edx-poc
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edx-poc-svc
                port:
                  number: 80
